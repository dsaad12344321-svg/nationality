name: Build User Activity Log EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/user-activity-log/**"
      - ".github/workflows/build-user-activity-agent.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install application and build dependencies
        working-directory: tools/user-activity-log
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone EXE
        working-directory: tools/user-activity-log
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name UserActivityLog --collect-all extract_msg --collect-all fitz --collect-all docx --hidden-import win32timezone --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes agent.py
          if (!(Test-Path "dist/UserActivityLog.exe")) {
            throw "EXE build did not produce dist/UserActivityLog.exe"
          }

      - name: Package EXE and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "tools/user-activity-log/dist/UserActivityLog.exe" "package/UserActivityLog.exe"
          @"
          User Activity Log - Windows EXE

          1. Extract UserActivityLog.exe from this ZIP.
          2. Double-click UserActivityLog.exe on the Windows computer that can access drive L:.
          3. Keep its console window open while using the website.
          4. The local service listens at http://127.0.0.1:8765/health.

          Reservation folder:
          L:\Common\Linked Documents\1-Reservation Data Long Beach\YYYY\MM\DD

          The EXE reads reservation files locally and copies matches to Desktop\output.
          It does not upload reservation documents to the website.
          "@ | Set-Content -Encoding UTF8 "package/README.txt"

      - name: Upload downloadable EXE package
        uses: actions/upload-artifact@v4
        with:
          name: UserActivityLog-Windows-x64
          path: package/*
          if-no-files-found: error
          retention-days: 30
